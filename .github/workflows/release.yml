name: release
# Push a tag such as v0.1.0 and this builds the single-file executables for linux-x64 and win-x64, checks them, and publishes a GitHub release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: read

jobs:
  conformance-full:
    # a release is built only after every group has passed on every engine
    uses: ./.github/workflows/conformance-full.yml

  build:
    needs: conformance-full
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, ext: tar.gz }
          - { os: windows-latest, rid: win-x64,   ext: zip }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prebuilt polyglot library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh ${{ matrix.rid }}
      - name: Unit tests
        run: dotnet test tests/DbDataBuild.Tests.Unit -c Release
      - name: Publish
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" scripts/publish.sh ${{ matrix.rid }} out
      - name: Smoke test the published executable
        shell: bash
        run: |
          exe=out/dbdatabuild; [ -f out/dbdatabuild.exe ] && exe=out/dbdatabuild.exe
          "$exe" --help > /dev/null
          "$exe" matrix --format json | grep -q '"ok": true'
      - name: Package
        shell: bash
        run: |
          name="dbdatabuild-${{ github.ref_name }}-${{ matrix.rid }}"
          mkdir "$name"
          cp out/dbdatabuild* LICENSE THIRD-PARTY-NOTICES.md README.md "$name"/
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          ls -l "$name.${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dbdatabuild-*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""; case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease

  scoop:
    # Keeps bucket/dbdatabuild.json (the Scoop manifest) on the newest full release. Pre-releases are skipped.
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir .
          python3 - <<'PY'
          import json, os, re
          tag = os.environ["TAG"]; version = tag.lstrip("v")
          name = f"dbdatabuild-{tag}-win-x64"
          sums = {l.split()[1]: l.split()[0] for l in open("SHA256SUMS") if l.strip()}
          path = "bucket/dbdatabuild.json"
          m = json.load(open(path))
          arch = m["architecture"]["64bit"]
          m["version"] = version
          arch["url"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{name}.zip"
          arch["hash"] = sums[f"{name}.zip"]
          arch["extract_dir"] = name
          open(path, "w", newline="\n").write(json.dumps(m, indent=4) + "\n")
          PY
          rm SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/dbdatabuild.json
          git diff --cached --quiet || { git commit -m "scoop: $TAG"; git push origin HEAD:main; }

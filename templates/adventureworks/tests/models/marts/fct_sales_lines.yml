      - {sales_order_id: 3, sales_order_detail_id: 3, date_key: 20240302, customer_id: 9, sales_person_id: 3, territory_id: 1, product_id: 5, special_offer_id: 1, order_qty: 1, currency_code: USD, rate_to_usd: 1.0000, gross_usd: 100.0000, discount_usd: 0.0000, revenue_usd: 100.0000, cost_usd: 40.0000, margin_usd: 60.0000}

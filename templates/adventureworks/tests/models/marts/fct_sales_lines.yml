# description: marts.fct_sales_lines converts at the latest rate on or before the order date and takes the cost of that day
# tags: marts, critical
cases:
  - name: a Saturday order in euros uses Friday's rate; the cost is the one in force on the day; cancelled orders are left out
    given:
      staging.orders:
        - {sales_order_id: 1, order_date: 2024-03-02, due_date: 2024-03-14, ship_date: 2024-03-04, status: 5, status_name: shipped, is_online: true, customer_id: 7, sales_person_id: null, territory_id: 8, currency_code: EUR, sub_total: 200.0000, tax_amt: 0.0000, freight: 0.0000, total_due: 200.0000}
        - {sales_order_id: 2, order_date: 2024-03-02, due_date: 2024-03-14, ship_date: null, status: 6, status_name: cancelled, is_online: true, customer_id: 7, sales_person_id: null, territory_id: 8, currency_code: EUR, sub_total: 50.0000, tax_amt: 0.0000, freight: 0.0000, total_due: 50.0000}
        - {sales_order_id: 3, order_date: 2024-03-02, due_date: 2024-03-14, ship_date: 2024-03-04, status: 5, status_name: shipped, is_online: false, customer_id: 9, sales_person_id: 3, territory_id: 1, currency_code: USD, sub_total: 100.0000, tax_amt: 0.0000, freight: 0.0000, total_due: 100.0000}
      staging.order_lines:
        - {sales_order_id: 1, sales_order_detail_id: 1, product_id: 5, order_qty: 2, unit_price: 100.0000, unit_price_discount: 0.1000, special_offer_id: 5, line_total: 180.0000}
        - {sales_order_id: 2, sales_order_detail_id: 2, product_id: 5, order_qty: 1, unit_price: 50.0000, unit_price_discount: 0.0000, special_offer_id: 1, line_total: 50.0000}
        - {sales_order_id: 3, sales_order_detail_id: 3, product_id: 5, order_qty: 1, unit_price: 100.0000, unit_price_discount: 0.0000, special_offer_id: 1, line_total: 100.0000}
      staging.currency_rates:
        - {rate_date: 2024-02-29, currency_code: EUR, average_rate: 1.0800, end_of_day_rate: 1.0800}
        - {rate_date: 2024-03-01, currency_code: EUR, average_rate: 1.1000, end_of_day_rate: 1.1000}
        - {rate_date: 2024-03-04, currency_code: EUR, average_rate: 1.2000, end_of_day_rate: 1.2000}
      staging.product_cost_history:

    given:
      marts.dim_date:
        - {date_key: 20240101, date: 2024-01-01, year: 2024, quarter: 1, month: 1, year_month: 202401, month_name: January, iso_weekday: 1, is_weekend: false, fiscal_year: 2024, fiscal_quarter: 3}

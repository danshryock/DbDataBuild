# description: marts.agg_product_abc classes products by the share of revenue they make up to
# tags: marts
cases:
  - name: one big product is A, the next B, the small ones C
    given:
      marts.fct_sales_lines:
        - {sales_order_id: 1, sales_order_detail_id: 1, date_key: 20240101, customer_id: 1, sales_person_id: null, territory_id: 1, product_id: 1, special_offer_id: 1, order_qty: 1, currency_code: USD, rate_to_usd: 1.0, gross_usd: 800.0, discount_usd: 0.0, revenue_usd: 800.0, cost_usd: 500.0, margin_usd: 300.0}
        - {sales_order_id: 1, sales_order_detail_id: 2, date_key: 20240101, customer_id: 1, sales_person_id: null, territory_id: 1, product_id: 2, special_offer_id: 1, order_qty: 1, currency_code: USD, rate_to_usd: 1.0, gross_usd: 150.0, discount_usd: 0.0, revenue_usd: 150.0, cost_usd: 100.0, margin_usd: 50.0}
        - {sales_order_id: 1, sales_order_detail_id: 3, date_key: 20240101, customer_id: 1, sales_person_id: null, territory_id: 1, product_id: 3, special_offer_id: 1, order_qty: 1, currency_code: USD, rate_to_usd: 1.0, gross_usd: 50.0, discount_usd: 0.0, revenue_usd: 50.0, cost_usd: 40.0, margin_usd: 10.0}
    expect:
      - {product_id: 1, revenue_rank: 1, revenue: 800.00, units: 1, cumulative_share: 0.8000, abc_class: A}
      - {product_id: 2, revenue_rank: 2, revenue: 150.00, units: 1, cumulative_share: 0.9500, abc_class: B}
      - {product_id: 3, revenue_rank: 3, revenue: 50.00, units: 1, cumulative_share: 1.0000, abc_class: C}
